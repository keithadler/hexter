name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            validator: ubuntu
            shell: bash
          - name: macOS
            os: macos-latest
            validator: macos-universal
            shell: bash
          # MSVC builds everything, the standalone included; it is what the release ships.
          - name: Windows-MSVC
            os: windows-latest
            validator: windows
            shell: bash
            toolchain: msvc
          # MinGW is kept building for people who use MSYS2; it skips the standalone.
          - name: Windows-MinGW
            os: windows-latest
            validator: windows
            shell: msys2 {0}
            toolchain: mingw
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (DSSI, GTK2, LV2 for the legacy targets)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y dssi-dev liblo-dev libgtk2.0-dev libasound2-dev libjack-jackd2-dev lv2-dev liblilv-dev lilv-utils libx11-dev

      - name: Set up the MSVC environment
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up MSYS2
        if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git
            unzip

      # Matches what the release ships: the standalone everybody gets does not link
      # JACK, because that would stop it starting on a machine without one.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DRTAUDIO_API_JACK=OFF ${{ matrix.os == 'windows-latest' && '-G Ninja' || '' }} ${{ matrix.os == 'macos-latest' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The release ships two Linux standalones; build and check both here, or a
      # break in either only shows up at release time.
      - name: Build the JACK standalone too
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -B build-jack -DCMAKE_BUILD_TYPE=Release -DHEXTER_BUILD_DSSI=OFF \
                -DHEXTER_BUILD_AUV2=OFF -DRTAUDIO_API_JACK=ON
          cmake --build build-jack --config Release --parallel --target hexter_wrapped_standalone

      - name: Check each Linux standalone carries what it should
        if: matrix.os == 'ubuntu-latest'
        run: |
          plain=build/wrapped/hexter
          jack=build-jack/wrapped/hexter
          fail() { echo "::error::$1"; exit 1; }
          grep -qa snd_pcm_open  "$plain" || fail "the plain standalone has no ALSA"
          grep -qa jack_client_open "$plain" && fail "the plain standalone links JACK; it would not start without it"
          grep -qa snd_pcm_open  "$jack"  || fail "the JACK standalone has no ALSA"
          grep -qa jack_client_open "$jack" || fail "the JACK standalone has no JACK"
          echo "plain standalone: ALSA, no JACK dependency. hexter-jack: both."

      - name: Check the LV2 bundle with lilv-utils
        if: matrix.os == 'ubuntu-latest'
        run: |
          LV2_PATH=$PWD/build/lv2 lv2ls | grep -q keithadler/hexter
          LV2_PATH=$PWD/build/lv2 lv2info https://github.com/keithadler/hexter

      - name: Validate with clap-validator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download 0.4.1 --repo free-audio/clap-validator --pattern "*${{ matrix.validator }}*" --dir validator
          cd validator
          for z in *.zip; do unzip -o -q "$z"; done
          for t in $(find . -name '*.tar.gz'); do tar xzf "$t" -C "$(dirname "$t")"; done
          V=$(find . -type f \( -name clap-validator -o -name clap-validator.exe \) | head -1)
          chmod +x "$V"
          cd ..
          "validator/$V" validate --only-failed build/hexter.clap

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: hexter-${{ matrix.name }}
          path: |
            build/hexter.clap
            build/lv2/hexter.lv2
            build/wrapped/hexter.component
            build/wrapped/hexter.app
            build/wrapped/hexter
            build/wrapped/Standalone-*/hexter.exe
            build/hexter-render
            build/hexter-render.exe
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the debug APK (the runner image carries the SDK and the NDK)
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: hexter-Android
          path: android/app/build/outputs/apk/debug/*.apk

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build for the simulator and for a device (unsigned; nothing to distribute)
        run: |
          xcodebuild -project ios/Hexter.xcodeproj -scheme Hexter -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project ios/Hexter.xcodeproj -scheme Hexter -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

