name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: macos-universal
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (ALSA and X11, for the standalone's audio, MIDI and window)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev

      # MSVC, because clap-wrapper's Windows standalone shell is C++/WinRT. The C runtime is
      # linked statically (CMakeLists.txt), so the zip needs no redistributable.
      - name: Set up the MSVC environment
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHEXTER_BUILD_DSSI=OFF ${{ matrix.os == 'windows-latest' && '-G Ninja' || '' }} ${{ matrix.os == 'macos-latest' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG=hexter-$VERSION-${{ matrix.name }}
          mkdir -p $PKG/banks
          cp -R build/hexter.clap $PKG/
          cp -R build/lv2/hexter.lv2 $PKG/
          [ -d build/wrapped/hexter.component ] && cp -R build/wrapped/hexter.component $PKG/ || true
          # the standalone: hexter.app (macOS), hexter (Linux), hexter.exe (Windows)
          [ -d build/wrapped/hexter.app ] && cp -R build/wrapped/hexter.app $PKG/ || true
          [ -f build/wrapped/hexter ] && cp build/wrapped/hexter $PKG/ || true
          cp build/wrapped/Standalone-*/hexter.exe $PKG/ 2>/dev/null || true
          cp build/hexter-render* $PKG/ 2>/dev/null || true
          cp extra/*.dx7 $PKG/banks/
          cp README.md CHANGELOG.md COPYING AUTHORS $PKG/
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            tar czf $PKG.tar.gz $PKG
          else
            zip -r -q $PKG.zip $PKG
          fi
          ls -la

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in hexter-*.tar.gz hexter-*.zip; do
            if [ -f "$f" ]; then gh release upload "$GITHUB_REF_NAME" "$f" --clobber; fi
          done
