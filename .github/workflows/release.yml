name: Release

on:
  push:
    tags: ["v*"]
  # A manual run builds and packages every platform and keeps the packages as workflow
  # artifacts instead of uploading them to a release: a dry run for a new runner or toolchain.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            family: linux
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            family: linux
          - name: macos-universal
            os: macos-latest
            family: macos
          - name: windows-x86_64
            os: windows-latest
            family: windows
            msvc_arch: x64
          - name: windows-arm64
            os: windows-11-arm
            family: windows
            msvc_arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies (ALSA and X11, for the standalone's audio, MIDI and window)
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev

      # MSVC, because clap-wrapper's Windows standalone shell is C++/WinRT. The C runtime is
      # linked statically (CMakeLists.txt), so the zip needs no redistributable.
      - name: Set up the MSVC environment
        if: matrix.family == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Ninja, if the runner image lacks it
        if: matrix.family == 'windows'
        run: command -v ninja || pip install ninja

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHEXTER_BUILD_DSSI=OFF ${{ matrix.family == 'windows' && '-G Ninja' || '' }} ${{ matrix.family == 'macos' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PKG=hexter-$VERSION-${{ matrix.name }}
          mkdir -p $PKG/banks
          cp -R build/hexter.clap $PKG/
          cp -R build/lv2/hexter.lv2 $PKG/
          [ -d build/wrapped/hexter.component ] && cp -R build/wrapped/hexter.component $PKG/ || true
          # the standalone: hexter.app (macOS), hexter (Linux), hexter.exe (Windows)
          [ -d build/wrapped/hexter.app ] && cp -R build/wrapped/hexter.app $PKG/ || true
          [ -f build/wrapped/hexter ] && cp build/wrapped/hexter $PKG/ || true
          cp build/wrapped/Standalone-*/hexter.exe $PKG/ 2>/dev/null || true
          cp build/hexter-render* $PKG/ 2>/dev/null || true
          cp extra/*.dx7 $PKG/banks/
          cp README.md CHANGELOG.md COPYING AUTHORS $PKG/
          if [ "${{ matrix.family }}" = "linux" ]; then
            tar czf $PKG.tar.gz $PKG
          elif [ "${{ matrix.family }}" = "windows" ]; then
            # Git's bash on the runner has no zip; 7-Zip is preinstalled.
            7z a -tzip -bd -bso0 $PKG.zip $PKG
          else
            zip -r -q $PKG.zip $PKG
          fi
          ls -la

      - name: Keep the package as an artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in hexter-*.tar.gz hexter-*.zip; do
            if [ -f "$f" ]; then gh release upload "$GITHUB_REF_NAME" "$f" --clobber; fi
          done

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The release APK is signed with a keystore kept as repository secrets; without them the
      # workflow still builds, unsigned, which is enough for a dry run.
      # The release APK is signed with the keystore kept in the repository secrets
      # HEXTER_KEYSTORE_BASE64 / HEXTER_KEYSTORE_PASSWORD / HEXTER_KEY_ALIAS / HEXTER_KEY_PASSWORD.
      # Without them a key is made for this run alone: the APK installs, but Android will not update
      # an installed copy in place across releases signed with different keys, so a user has to
      # uninstall first. Set the secrets and every release signs the same.
      - name: Signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.HEXTER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HEXTER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HEXTER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HEXTER_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/hexter-android.jks"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          else
            echo "::warning::no HEXTER_KEYSTORE_BASE64 secret: signing this APK with a key made for this run only"
            KEYSTORE_PASSWORD=$(openssl rand -hex 16); KEY_ALIAS=hexter; KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias hexter -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=hexter for Android (unattended build)" > /dev/null 2>&1
          fi
          { echo "HEXTER_KEYSTORE=$KS"; echo "HEXTER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"; echo "HEXTER_KEY_ALIAS=$KEY_ALIAS"; echo "HEXTER_KEY_PASSWORD=$KEY_PASSWORD"; } >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease
          VERSION=${GITHUB_REF_NAME#v}
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "../hexter-$VERSION-android.apk"
          ls -la ../hexter-*.apk
      - name: Keep the package as an artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: hexter-*.apk
      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" hexter-*.apk --clobber
